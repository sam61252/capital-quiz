<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flags &amp; Capitals</title>
    <meta name="description" content="Learn and quiz world flags &amp; capitals — offline." />

    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Flags" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" href="./icons/icon-192.png" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- ===================== HOME ===================== -->
      <section id="home" class="view">
        <header class="home-header">
          <div class="logo" aria-hidden="true">🌍</div>
          <h1 class="app-title">Flags &amp; Capitals</h1>
          <p class="app-tagline" id="tagline">learn &amp; quiz</p>
        </header>

        <button id="scope-btn" class="scope-btn" type="button">🌐 All countries</button>
        <div id="home-cards" class="home-cards"></div>

        <footer class="home-footer">
          <p>Learn the course or take a quick quiz. Works fully offline.</p>
          <p class="credit">
            Data: mledoze/countries (ODbL) · Flags: lipis/flag-icons (MIT) · Map: Natural Earth (public domain)
          </p>
        </footer>
      </section>

      <!-- ===================== QUIZ ===================== -->
      <section id="quiz" class="view hidden">
        <div class="topbar">
          <button id="quiz-home-btn" class="icon-btn" type="button">‹ Menu</button>
          <div class="streaks">
            <span class="streak" title="Current streak">🔥 <b id="cur-streak">0</b></span>
            <span class="best" title="Best streak">Best <b id="best-streak">0</b></span>
          </div>
        </div>
        <div id="quiz-scope" class="scope-chip"></div>
        <div id="quiz-body"></div>
      </section>

      <!-- ===================== STUDY ===================== -->
      <section id="study" class="view hidden">
        <div class="topbar">
          <button id="study-home-btn" class="icon-btn" type="button">‹ Menu</button>
          <div id="study-status" class="streaks"></div>
        </div>
        <div id="study-body"></div>
      </section>

      <!-- ===================== SCOPE MODAL ===================== -->
      <div id="scope-modal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-head">
            <h2>Choose area</h2>
            <button id="scope-close" class="icon-btn" type="button" aria-label="Close">✕</button>
          </div>
          <div id="scope-list" class="scope-list"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
